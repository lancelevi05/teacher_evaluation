<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#152A54;
    --blue-mid:#1E3E7A;
    --blue-accent:#4C7CF0;
    --ink:#151922;
    --paper:#FBFBFD;
    --line:#E4E7EE;
    --muted:#8A90A0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:stretch;
  }

  .screen{
    display:flex;
    width:100%;
    min-height:100vh;
  }

  /* ---------- LEFT PANEL ---------- */
  .brand-panel{
    position:relative;
    flex:0 0 44%;
    background:
      radial-gradient(circle at 18% 14%, rgba(76,124,240,0.35), transparent 55%),
      linear-gradient(160deg, var(--blue-mid) 0%, var(--blue-deep) 70%);
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:56px 52px;
    overflow:hidden;
  }

  .brand-panel::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 30% 30%, black, transparent 75%);
  }

  .brand-panel::after{
    content:"";
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.10);
    right:-220px;
    bottom:-220px;
  }

  .brand-top{position:relative; z-index:1;}

  .logo-mark{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .logo-glyph{
    width:38px;
    height:38px;
    flex-shrink:0;
  }

  .logo-word{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:0.01em;
  }

  .brand-mid{position:relative; z-index:1; max-width:380px;}

  .brand-mid h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:34px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 14px 0;
  }

  .brand-mid p{
    font-size:15px;
    line-height:1.6;
    color:rgba(255,255,255,0.72);
    margin:0;
  }

  .brand-bottom{
    position:relative;
    z-index:1;
    font-size:13px;
    color:rgba(255,255,255,0.5);
    display:flex;
    gap:22px;
  }

  /* ---------- RIGHT PANEL ---------- */
  .form-panel{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 32px;
  }

  .form-wrap{
    width:100%;
    max-width:360px;
  }

  .form-wrap h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 6px 0;
  }

  .form-sub{
    font-size:14.5px;
    color:var(--muted);
    margin:0 0 32px 0;
  }

  .field{
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:7px;
  }

  .field input{
    width:100%;
    padding:12px 14px;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  .field input::placeholder{color:#B7BBC7;}

  .field input:focus{
    border-color:var(--blue-accent);
    box-shadow:0 0 0 3px rgba(76,124,240,0.15);
  }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:4px 0 26px 0;
    font-size:13.5px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:#4A4F5C;
    cursor:pointer;
    user-select:none;
  }

  .remember input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:17px;
    height:17px;
    border:1.5px solid #C7CBD6;
    border-radius:5px;
    display:inline-block;
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, border-color .15s ease;
  }

  .remember input[type="checkbox"]:checked{
    background:var(--blue-accent);
    border-color:var(--blue-accent);
  }

  .remember input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left:5px;
    top:1.5px;
    width:4px;
    height:8px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }

  .forgot{
    color:var(--blue-accent);
    text-decoration:none;
    font-weight:500;
  }
  .forgot:hover{text-decoration:underline;}

  .btn-primary{
    width:100%;
    padding:13px 14px;
    background:var(--blue-deep);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease;
  }
  .btn-primary:hover{background:var(--blue-mid);}
  .btn-primary:active{transform:translateY(1px);}

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0;
    color:var(--muted);
    font-size:12.5px;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .btn-secondary{
    width:100%;
    padding:12px 14px;
    background:#fff;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    border:1.5px solid var(--line);
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-secondary:hover{border-color:#C7CBD6; background:#F7F8FA;}

  .signup-line{
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    margin-top:28px;
  }
  .signup-line a{color:var(--blue-accent); text-decoration:none; font-weight:600;}
  .signup-line a:hover{text-decoration:underline;}

  @media (max-width:840px){
    .brand-panel{display:none;}
    .form-panel{padding:32px 20px;}
  }
</style>
</head>
<body>

<div class="screen">

  <!-- LEFT: brand / logo panel -->
  <div class="brand-panel">
    <div class="brand-top">
      <div class="logo-mark">
        <svg class="logo-glyph" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="16" height="16" rx="4" fill="#ffffff"/>
          <rect x="22" y="2" width="16" height="16" rx="4" fill="rgba(255,255,255,0.35)"/>
          <rect x="2" y="22" width="16" height="16" rx="4" fill="rgba(255,255,255,0.35)"/>
          <rect x="22" y="22" width="16" height="16" rx="4" fill="#ffffff"/>
        </svg>
        <span class="logo-word">Northline</span>
      </div>
    </div>

    <div class="brand-mid">
      <h1>Welcome back to your workspace.</h1>
      <p>Sign in to pick up your projects, review activity, and keep things moving with your team.</p>
    </div>

    <div class="brand-bottom">
      <span>© 2026 Northline</span>
      <span>Privacy</span>
      <span>Terms</span>
    </div>
  </div>

  <!-- RIGHT: login form -->
  <div class="form-panel">
    <div class="form-wrap">
      <h2>Sign in</h2>
      <p class="form-sub">Enter your details to access your account.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>

      <div class="divider">or continue with</div>

      <button type="button" class="btn-secondary">
        <svg width="17" height="17" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.92c1.71-1.57 2.69-3.88 2.69-6.64z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1 0-3.42V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>

      <p class="signup-line">Don't have an account? <a href="#">Create one</a></p>
    </div>
  </div>

</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    // Hook up real authentication here.
    console.log('Sign in submitted');
  });
</script>

</body>
</html>
